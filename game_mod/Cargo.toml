[package]
name = "luftrapelago"
version = "0.1.1"
edition = "2024"

[lib]
name = "version" # Matches the proxied DLL name (version.dll)
crate-type = ["cdylib"]

[dependencies]
archipelago_rs = { branch = "feature/tracked-scouted-locations", git = "ssh://git@github.com/Lindenk/archipelago_rs.git" }
detour = "0.10.0"
num_enum = "0.7.6"
paste = "1.0.15"
rand = "0.10.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["alloc", "derive"] }
ustr = { version = "1.1.0", features = ["serde"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Memory",
  "Win32_System_Threading"
] }
