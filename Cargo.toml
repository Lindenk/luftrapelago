[package]
name = "luftrapelago"
version = "0.1.0"
edition = "2024"

[lib]
name = "version" # Matches the proxied DLL name (version.dll)
crate-type = ["cdylib"]

[dependencies]
detour = "0.10.0"
paste = "1.0.15"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }
